<style>
  :root {

    --bezel-edge: #35322d;
    --surface: #ffffff;
    --surface-variant: #f5f5f5;
    --border: #eaeaea;
    --border-heavy: #dfdfdf;
    --ink: #323232;
    --ink-muted: #8b8a8a;
    --ink-faint: #c3c1bd;

    --accent-soft: #fff5f0;

    --surface-subtle: #fafafa;

      --border: #333338;

      --ink-faint: #45444a;
      --accent: #ff7a35;
      --accent-soft: rgba(255, 122, 53, 0.16);
      --accent-ink: #1c1c1e;
      --gain: #ff6a6a;
      --loss: #43c62c;
      --shadow: rgba(0, 0, 0, 0.55);
      --caption-ink: #b9b6b0;
      --link: #57b8f2;
      --placeholder: #6f6e72;
      --tag-dark-bg: #3a3a3d;
      --overlay: rgba(0, 0, 0, 0.6);
      --surface-variant-high: #38383c;
      --surface-subtle: #222124;
    }
  }

  :root[data-theme="dark"] {
    --backdrop-1: #111013;
    --backdrop-2: #1a181c;
    --bezel: #050505;
    --bezel-edge: #232226;
    --surface: #1c1c1e;
    --surface-variant: #262629;
    --border: #333338;
    --border-heavy: #424248;
    --ink: #f1efec;
    --ink-muted: #9c9a9e;
    --ink-faint: #45444a;
    --accent: #ff7a35;
    --accent-soft: rgba(255, 122, 53, 0.16);
    --accent-ink: #1c1c1e;
    --gain: #ff6a6a;
    --loss: #43c62c;
    --shadow: rgba(0, 0, 0, 0.55);
    --caption-ink: #b9b6b0;
    --link: #57b8f2;
    --placeholder: #6f6e72;
    --tag-dark-bg: #3a3a3d;
    --overlay: rgba(0, 0, 0, 0.6);
    --surface-variant-high: #38383c;
    --surface-subtle: #222124;
  }

  :root[data-theme="light"] {
    --backdrop-1: #efece6;
    --backdrop-2: #e5ded3;
    --bezel: #1b1a18;
    --bezel-edge: #35322d;
    --surface: #ffffff;
    --surface-variant: #f5f5f5;
    --border: #eaeaea;
    --border-heavy: #dfdfdf;
    --ink: #323232;
    --ink-muted: #8b8a8a;
    --ink-faint: #c3c1bd;
    --accent: #fa5a00;
    --accent-soft: #fff5f0;
    --accent-ink: #ffffff;
    --gain: #e83c3c;
    --loss: #339c09;
    --shadow: rgba(35, 26, 15, 0.22);
    --caption-ink: #6b675f;
    --link: #32a0dc;
    --placeholder: #b3b2b2;
    --tag-dark-bg: #545454;
    --overlay: rgba(0, 0, 0, 0.5);
    --surface-variant-high: #eaeaea;
    --surface-subtle: #fafafa;
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  html, body {
    margin: 0;
    min-height: 100%;
  }

  body {
    font-family: "LINE Seed TW", "LINE Seed TW_TTF", -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Helvetica Neue", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 18% 12%, var(--backdrop-2), transparent 55%),
      radial-gradient(circle at 84% 88%, var(--backdrop-2), transparent 50%),
      var(--backdrop-1);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 22px;
    padding: 48px 20px 64px;
  }

  .studio-tag {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
  }

  .studio-tag .eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .studio-tag h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 700;
    color: var(--ink);
  }

  .studio-tag p {
    margin: 0;
    font-size: 12.5px;
    color: var(--caption-ink);
    max-width: 320px;
    line-height: 1.5;
  }

  .device {
    background: linear-gradient(160deg, var(--bezel-edge), var(--bezel) 60%);
    border-radius: 52px;
    padding: 14px;
    box-shadow: 0 30px 60px -20px var(--shadow), 0 2px 10px rgba(0,0,0,0.15);
    position: relative;
  }

  .screen {
    width: 402px;
    height: 852px;
    background: var(--surface);
    border-radius: 40px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .dynamic-island {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 108px;
    height: 28px;
    background: var(--bezel);
    border-radius: 16px;
    z-index: 20;
  }

  .chrome {
    flex-shrink: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }

  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 26px 8px;
  }

  .status-bar .time {
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .status-icons {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--ink);
  }

  .header-row {
    display: flex;
    align-items: center;
    height: 48px;
    padding: 0 4px;
    position: relative;
  }

  .icon-btn {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    color: var(--ink);
    cursor: pointer;
    border-radius: 12px;
  }

  .icon-btn:hover { background: var(--surface-variant); }

  .header-row h2 {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
  }

  .scroll-area {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
  }

  .panel {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .segment {
    display: flex;
    border-radius: 8px;
    overflow: hidden;
    background: var(--accent-soft);
    gap: 1px;
  }

  .segment button {
    flex: 1;
    border: none;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 15px;
    font-family: inherit;
    padding: 9px 4px;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }

  .segment button:hover { background: color-mix(in srgb, var(--accent-soft) 60%, var(--accent) 15%); }

  .segment button[aria-pressed="true"] {
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 700;
  }

  /* Date range picker sheet */
  .date-sheet-header {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 16px;
    flex-shrink: 0;
  }

  .date-sheet-header .sheet-title { position: static; transform: none; }

  .date-sheet-body {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 0 16px 16px;
    overflow-y: auto;
  }

  .date-preset-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .date-preset-chip {
    border-radius: 8px;
    border: none;
    background: var(--surface-variant);
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
    line-height: 16px;
    padding: 8px 10px;
    cursor: pointer;
  }

  .date-preset-chip[aria-pressed="true"] {
    background: var(--tag-dark-bg);
    color: #fff;
  }

  .date-hr { height: 1px; background: var(--border); border: none; margin: 0; width: 100%; }

  .date-summary-row {
    display: flex;
    gap: 24px;
    font-size: 14px;
  }

  .date-summary-item {
    flex: 1;
    display: flex;
    justify-content: space-between;
    min-width: 0;
  }

  .date-summary-item .label { color: var(--ink-muted); }
  .date-summary-item .value { color: var(--ink); font-variant-numeric: tabular-nums; }

  .date-nav-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .date-nav-label {
    display: flex;
    align-items: baseline;
    gap: 4px;
    font-size: 20px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .date-nav-btns { display: flex; gap: 16px; }

  .date-nav-btn {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    color: var(--ink);
    cursor: pointer;
    border-radius: 50%;
  }

  .date-nav-btn:hover { background: var(--surface-variant); }
  .date-nav-btn:disabled { color: var(--ink-faint); cursor: default; }
  .date-nav-btn:disabled:hover { background: none; }

  .calendar-weekdays,
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }

  .calendar-weekdays div {
    text-align: center;
    font-size: 13px;
    color: var(--ink-muted);
    padding: 6px 0;
  }

  .calendar-day-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3px 0;
  }

  .calendar-day {
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: none;
    background: none;
    color: var(--ink);
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    font-family: inherit;
  }

  .calendar-day:hover { background: var(--surface-variant); }

  .calendar-day.is-outside { color: var(--ink-faint); cursor: default; }
  .calendar-day.is-outside:hover { background: none; }

  .calendar-day.is-today { border: 1.5px solid var(--ink); }

  function getBounds() {

    switch (state.range) {

      case "custom":
        start = new Date(state.customStart + "T00:00:00");

  function fmtInt(n) { return n.toLocaleString("en-US"); }

  function fmtSigned(n) {
    return Math.round(Math.abs(n)).toLocaleString("en-US");

  function fmtPct(n) {
    var abs = Math.abs(n);

      if (state.categories.length > 0 && state.categories.indexOf(r.category) === -1) return false;

      if (av < bv) return dir === "asc" ? -1 : 1;

      return 0;
    });

    document.getElementById("dateStartValue").textContent = dateSheetState.start ? fmtSlash(dateSheetState.start) : "-";
    document.getElementById("dateEndValue").textContent = dateSheetState.end ? fmtSlash(dateSheetState.end) : "-";
    document.getElementById("dateConfirm").disabled = !(dateSheetState.start && dateSheetState.end);
  }

  function pickDate(d) {
    dateSheetState.preset = "custom";
    if (!dateSheetState.start || (dateSheetState.start && dateSheetState.end)) {
      dateSheetState.start = d;
      dateSheetState.end = null;
    } else if (d < dateSheetState.start) {
      dateSheetState.start = d;
      dateSheetState.end = null;
    } else {
      var diffDays = Math.round((d - dateSheetState.start) / 86400000);
      if (diffDays > 365) {
        dateSheetState.start = d;
        dateSheetState.end = null;
      } else {
        dateSheetState.end = d;
      }
    }
    renderDatePresets();
    renderDateSummary();
    renderCalendar();
  }

  function renderCalendar() {
    document.getElementById("dateNavLabel").textContent =
      pad(dateSheetState.viewMonth + 1) + " 月  " + dateSheetState.viewYear + " 年";

    var isAtCurrentMonth =
      dateSheetState.viewYear > NOW.getFullYear() ||
      (dateSheetState.viewYear === NOW.getFullYear() && dateSheetState.viewMonth >= NOW.getMonth());
    document.getElementById("dateNavNext").disabled = isAtCurrentMonth;

    var firstOfMonth = new Date(dateSheetState.viewYear, dateSheetState.viewMonth, 1);
    var startWeekday = firstOfMonth.getDay();
    var daysInMonth = new Date(dateSheetState.viewYear, dateSheetState.viewMonth + 1, 0).getDate();
    var daysInPrevMonth = new Date(dateSheetState.viewYear, dateSheetState.viewMonth, 0).getDate();

    var cells = [];
    for (var i = 0; i < startWeekday; i++) {
      cells.push({ day: daysInPrevMonth - startWeekday + 1 + i, outside: true });
    }
    for (var d = 1; d <= daysInMonth; d++) {
      cells.push({ day: d, outside: false, date: new Date(dateSheetState.viewYear, dateSheetState.viewMonth, d) });
    }
    var remainder = cells.length % 7;
    if (remainder !== 0) {
      var need = 7 - remainder;
      for (var j = 1; j <= need; j++) cells.push({ day: j, outside: true });
    }

    var grid = document.getElementById("calendarGrid");
    grid.innerHTML = "";
    var today = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());

    cells.forEach(function (c) {
      var cellWrap = document.createElement("div");
      cellWrap.className = "calendar-day-cell";

      if (c.outside) {
        var outsideEl = document.createElement("div");
        outsideEl.className = "calendar-day is-outside";
        outsideEl.textContent = c.day;
        cellWrap.appendChild(outsideEl);
        grid.appendChild(cellWrap);
        return;
      }

      var cd = c.date;
      var isToday = sameDay(cd, today);
      var isStart = dateSheetState.start && sameDay(cd, dateSheetState.start);
      var isEnd = dateSheetState.end && sameDay(cd, dateSheetState.end);
      var inRange = dateSheetState.start && dateSheetState.end && cd > dateSheetState.start && cd < dateSheetState.end;
      var isFuture = cd > today;

      if (inRange || isStart || isEnd) {
        cellWrap.classList.add("is-in-range");
        if (isStart) cellWrap.classList.add("is-range-start");
        if (isEnd) cellWrap.classList.add("is-range-end");
      }

      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "calendar-day";
      if (isToday) btn.classList.add("is-today");
      if (isStart || isEnd) btn.classList.add("is-endpoint");
      if (isFuture) {
        btn.classList.add("is-outside");
        btn.disabled = true;
      }
      btn.textContent = c.day;
      btn.addEventListener("click", function () { pickDate(cd); });
      cellWrap.appendChild(btn);
      grid.appendChild(cellWrap);
    });
  }

  function openDateSheet() {
    dateSheetState.open = true;
    if (state.range === "custom" && state.customStart && state.customEnd) {
      dateSheetState.start = new Date(state.customStart + "T00:00:00");
      dateSheetState.end = new Date(state.customEnd + "T00:00:00");
    } else {
      dateSheetState.start = null;
      dateSheetState.end = null;
    }
    dateSheetState.preset = "custom";
    var viewBase = dateSheetState.end || NOW;
    dateSheetState.viewYear = viewBase.getFullYear();
    dateSheetState.viewMonth = viewBase.getMonth();

    renderDatePresets();
    renderDateSummary();
    renderCalendar();
    document.getElementById("dateSheetOverlay").classList.add("is-open");
  }

  function closeDateSheet() {
    dateSheetState.open = false;
    document.getElementById("dateSheetOverlay").classList.remove("is-open");
  }

  document.getElementById("dateNavPrev").addEventListener("click", function () {
    dateSheetState.viewMonth -= 1;
    if (dateSheetState.viewMonth < 0) {
      dateSheetState.viewMonth = 11;
      dateSheetState.viewYear -= 1;
    }
    renderCalendar();
  });

  document.getElementById("dateNavNext").addEventListener("click", function () {
    dateSheetState.viewMonth += 1;
    if (dateSheetState.viewMonth > 11) {
      dateSheetState.viewMonth = 0;
      dateSheetState.viewYear += 1;
    }
    renderCalendar();
  });

  document.getElementById("dateConfirm").addEventListener("click", function () {
    if (!dateSheetState.start || !dateSheetState.end) return;
    state.range = "custom";
    state.customStart = toISO(dateSheetState.start);
    state.customEnd = toISO(dateSheetState.end);
    closeDateSheet();
    renderAll();
  });

  document.getElementById("dateCancel").addEventListener("click", closeDateSheet);

  document.getElementById("dateSheetOverlay").addEventListener("click", function (e) {
    if (e.target === this) closeDateSheet();
  });

  renderAll();
})();
</script>
