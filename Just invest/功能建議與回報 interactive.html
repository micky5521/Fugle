<style>
  :root {
    --backdrop-1: #efece6;
    --backdrop-2: #e5ded3;
    --bezel: #1b1a18;
    --bezel-edge: #35322d;
    --surface: #ffffff;
    --surface-variant: #f5f5f5;
    --border: #eaeaea;
    --border-heavy: #dfdfdf;
    --ink: #323232;
    --ink-muted: #8b8a8a;
    --ink-faint: #c3c1bd;
    --accent: #fa5a00;
    --accent-soft: #fff5f0;
    --accent-ink: #ffffff;
    --shadow: rgba(35, 26, 15, 0.22);
    --caption-ink: #6b675f;
    --link: #32a0dc;
    --placeholder: #b3b2b2;
    --overlay: rgba(0, 0, 0, 0.5);
    --surface-variant-high: #eaeaea;
    --surface-subtle: #fafafa;
    --danger: #e83c3c;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --backdrop-1: #111013;
      --backdrop-2: #1a181c;
      --bezel: #050505;

      --border: #333338;
      --border-heavy: #424248;

      --ink-faint: #45444a;
      --accent: #ff7a35;
      --accent-soft: rgba(255, 122, 53, 0.16);
      --accent-ink: #1c1c1e;
      --shadow: rgba(0, 0, 0, 0.55);
      --caption-ink: #b9b6b0;
      --link: #57b8f2;
      --placeholder: #6f6e72;
      --overlay: rgba(0, 0, 0, 0.6);
      --surface-variant-high: #38383c;
      --surface-subtle: #222124;
      --danger: #ff6a6a;
    }
  }

  :root[data-theme="dark"] {
    --backdrop-1: #111013;
    --backdrop-2: #1a181c;
    --bezel: #050505;
    --bezel-edge: #232226;
    --surface: #1c1c1e;
    --surface-variant: #262629;
    --border: #333338;
    --border-heavy: #424248;
    --ink: #f1efec;
    --ink-muted: #9c9a9e;
    --ink-faint: #45444a;
    --accent: #ff7a35;
    --accent-soft: rgba(255, 122, 53, 0.16);
    --accent-ink: #1c1c1e;
    --shadow: rgba(0, 0, 0, 0.55);
    --caption-ink: #b9b6b0;
    --link: #57b8f2;
    --placeholder: #6f6e72;
    --overlay: rgba(0, 0, 0, 0.6);
    --surface-variant-high: #38383c;
    --surface-subtle: #222124;
    --danger: #ff6a6a;
  }

  :root[data-theme="light"] {
    --backdrop-1: #efece6;
    --backdrop-2: #e5ded3;
    --bezel: #1b1a18;
    --bezel-edge: #35322d;
    --surface: #ffffff;
    --surface-variant: #f5f5f5;
    --border: #eaeaea;
    --border-heavy: #dfdfdf;
    --ink: #323232;
    --ink-muted: #8b8a8a;
    --ink-faint: #c3c1bd;
    --accent: #fa5a00;
    --accent-soft: #fff5f0;
    --accent-ink: #ffffff;
    --shadow: rgba(35, 26, 15, 0.22);
    --caption-ink: #6b675f;
    --link: #32a0dc;
    --placeholder: #b3b2b2;
    --overlay: rgba(0, 0, 0, 0.5);
    --surface-variant-high: #eaeaea;
    --surface-subtle: #fafafa;
    --danger: #e83c3c;
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  html, body { margin: 0; min-height: 100%; }

  body {
    font-family: "LINE Seed TW", "LINE Seed TW_TTF", -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Helvetica Neue", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 18% 12%, var(--backdrop-2), transparent 55%),
      radial-gradient(circle at 84% 88%, var(--backdrop-2), transparent 50%),
      var(--backdrop-1);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 22px;
    padding: 48px 20px 64px;
  }

  .studio-tag { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .studio-tag .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
  .studio-tag h1 { margin: 0; font-size: 19px; font-weight: 700; color: var(--ink); }
  .studio-tag p { margin: 0; font-size: 12.5px; color: var(--caption-ink); max-width: 320px; line-height: 1.5; }

  .device {
    background: linear-gradient(160deg, var(--bezel-edge), var(--bezel) 60%);
    border-radius: 52px;
    padding: 14px;
    box-shadow: 0 30px 60px -20px var(--shadow), 0 2px 10px rgba(0,0,0,0.15);
    position: relative;
  }

  .screen {
    width: 402px;
    height: 852px;
    background: var(--surface-variant);
    border-radius: 40px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .dynamic-island {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 108px; height: 28px; background: var(--bezel); border-radius: 16px; z-index: 20;
  }

  .chrome { flex-shrink: 0; background: var(--surface); border-bottom: 1px solid var(--border); z-index: 10; }

  .status-bar { display: flex; align-items: center; justify-content: space-between; padding: 20px 26px 8px; }
  .status-bar .time { font-size: 16px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .status-icons { display: flex; align-items: center; gap: 6px; color: var(--ink); }

  .header-row { display: flex; align-items: center; height: 48px; padding: 0 4px; position: relative; }
  .icon-btn {
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    background: none; border: none; color: var(--ink); cursor: pointer; border-radius: 12px;
  }
  .icon-btn:hover { background: var(--surface-variant); }
  .header-row h2 {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    margin: 0; font-size: 16px; font-weight: 700; color: var(--ink);
  }

  .scroll-area { flex: 1; overflow-y: auto; overflow-x: hidden; }
  .scroll-area::-webkit-scrollbar { width: 6px; }
  .scroll-area::-webkit-scrollbar-thumb { background: var(--border-heavy); border-radius: 3px; }

  .panel { padding: 12px 16px; display: flex; flex-direction: column; gap: 24px; }

  .field { display: flex; flex-direction: column; gap: 4px; }
  .field > label { font-size: 14px; font-weight: 400; color: var(--ink); line-height: 20px; }

  textarea {
    width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 16px; font-size: 15px; font-family: inherit; color: var(--ink); resize: none;
  }
  textarea { height: 108px; line-height: 1.5; }
  textarea::placeholder { color: var(--placeholder); }
  textarea:focus { outline: none; border-color: var(--accent); }

  .char-count { align-self: flex-end; font-size: 11.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

  .upload-field { gap: 8px; }
  .caption { margin: 0; font-size: 14px; color: var(--ink-muted); line-height: 20px; }

  .shot-row { display: flex; flex-wrap: wrap; gap: 8px; }

  .shot-add {
    width: 96px; height: 96px; flex-shrink: 0; border-radius: 8px; border: 1px dashed var(--border-heavy);
    background: var(--surface); color: var(--ink-muted); display: flex; align-items: center;
    justify-content: center; cursor: pointer; transition: border-color 0.15s, background-color 0.15s, color 0.15s;
  }
  .shot-add:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

  .shot-thumb {
    position: relative; width: 96px; height: 96px; border-radius: 8px; overflow: hidden;
    border: 1px solid var(--border); flex-shrink: 0; background: #000;
  }
  .shot-thumb img, .shot-thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shot-thumb .video-badge {
    position: absolute; left: 4px; bottom: 4px; display: flex; align-items: center; gap: 2px;
    background: rgba(0,0,0,0.55); color: #fff; border-radius: 4px; padding: 2px 5px; font-size: 10px;
  }
  .shot-thumb .remove {
    position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%;
    background: rgba(0,0,0,0.55); color: #fff; border: none; display: flex; align-items: center;
    justify-content: center; cursor: pointer; padding: 0; font-size: 11px; line-height: 1;
  }

  .submit-btn {
    margin-top: 4px; background: var(--accent); color: var(--accent-ink); border: none;
    border-radius: 8px; padding: 13px; font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer;
  }
  .submit-btn:active { opacity: 0.85; }
  .submit-btn:disabled { background: var(--surface-variant-high); color: var(--ink-faint); cursor: default; }

  .confirm-state {
    display: none; align-items: center; justify-content: center; text-align: center;
    min-height: 100%; padding: 32px 16px; box-sizing: border-box;
  }
  .confirm-state.show { display: flex; }
  .confirm-inner { display: flex; flex-direction: column; align-items: center; gap: 24px; width: fit-content; max-width: 100%; }
  .confirm-illustration { width: 200px; height: 200px; }
  .confirm-state h3 { font-size: 24px; font-weight: 700; line-height: 30px; margin: 0; color: var(--ink); white-space: nowrap; }
  .confirm-actions { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; }
  .confirm-back-btn { width: 100%; padding: 12px 16px; box-sizing: border-box; }

  .my-page-state {
    display: none; position: absolute; inset: 0; background: var(--surface-variant);
    align-items: center; justify-content: center; flex-direction: column; gap: 24px;
    padding: 32px 16px; box-sizing: border-box; z-index: 30;
  }
  .my-page-state.show { display: flex; }
  .my-page-state p { font-size: 16px; color: var(--ink-muted); margin: 0; }
  .my-page-state .submit-btn { width: 200px; }

  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .foot-note { max-width: 340px; text-align: center; font-size: 11.5px; line-height: 1.5; color: var(--caption-ink); }
</style>

  <h1>功能建議與回報</h1>

<p class="foot-note">輸入內容、上傳檔案後按下送出，畫面會即時切換成確認狀態 — 完整模擬吉盈 App「功能建議與回報」頁面的實際互動，上傳的檔案僅在瀏覽器本機預覽，不會被傳送或儲存。</p>

<script>
(function () {
  "use strict";

  var ideaText = document.getElementById("ideaText");
  var charCount = document.getElementById("charCount");
  ideaText.addEventListener("input", function () {
    charCount.textContent = ideaText.value.length;
  });

  var MAX_FILES = 3;
  var files = [];
  var shotRow = document.getElementById("shotRow");
  var fileInput = document.getElementById("fileInput");

  function openFilePicker() {
    if (files.length >= MAX_FILES) return;
    fileInput.click();
  }

  function renderShots() {
    shotRow.innerHTML = "";
    files.forEach(function (f, i) {
      var div = document.createElement("div");
      div.className = "shot-thumb";
      var isVideo = f.file.type.indexOf("video/") === 0;
      if (isVideo) {
        var video = document.createElement("video");
        video.src = f.url;
        video.muted = true;
        video.playsInline = true;
        div.appendChild(video);
        var badge = document.createElement("span");
        badge.className = "video-badge";
        badge.textContent = "影片";
        div.appendChild(badge);
      } else {
        var img = document.createElement("img");
        img.src = f.url;
        img.alt = "上傳檔案 " + (i + 1);
        div.appendChild(img);
      }
      var btn = document.createElement("button");
      btn.className = "remove";
      btn.type = "button";
      btn.setAttribute("aria-label", "移除這個檔案");
      btn.textContent = "✕";
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        URL.revokeObjectURL(f.url);
        files.splice(i, 1);
        renderShots();
      });
      div.appendChild(btn);
      shotRow.appendChild(div);
    });

    if (files.length < MAX_FILES) {
      var addBtn = document.createElement("button");
      addBtn.type = "button";
      addBtn.className = "shot-add";
      addBtn.id = "shotAdd";
      addBtn.setAttribute("aria-label", "上傳檔案");
      addBtn.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
      addBtn.addEventListener("click", openFilePicker);
      shotRow.appendChild(addBtn);
    }
  }

  fileInput.addEventListener("change", function () {
    var incoming = Array.prototype.slice.call(fileInput.files || []);
    incoming.forEach(function (file) {
      if (files.length >= MAX_FILES) return;
      files.push({ file: file, url: URL.createObjectURL(file) });
    });
    fileInput.value = "";
    renderShots();
  });

  renderShots();

  document.getElementById("submitBtn").addEventListener("click", function () {
    document.getElementById("formPanel").style.display = "none";
    document.getElementById("confirmState").classList.add("show");
  });

  function resetForm() {
    document.getElementById("formPanel").style.display = "flex";
    ideaText.value = "";
    charCount.textContent = "0";
    files.forEach(function (f) { URL.revokeObjectURL(f.url); });
    files = [];
    renderShots();
  }

  document.getElementById("confirmBackBtn").addEventListener("click", function () {
    document.getElementById("confirmState").classList.remove("show");
    document.getElementById("myPageState").classList.add("show");
  });

  document.getElementById("backBtn").addEventListener("click", function () {
    document.getElementById("confirmState").classList.remove("show");
    document.getElementById("formPanel").style.display = "none";
    document.getElementById("myPageState").classList.add("show");
  });

  document.getElementById("myPageRetryBtn").addEventListener("click", function () {
    document.getElementById("myPageState").classList.remove("show");
    resetForm();
  });
})();
</script>
