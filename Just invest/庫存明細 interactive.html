<style>
  :root {
    --backdrop-1: #efece6;
    --backdrop-2: #e5ded3;
    --bezel: #1b1a18;
    --bezel-edge: #35322d;
    --surface: #ffffff;
    --surface-variant: #f5f5f5;
    --border: #eaeaea;
    --border-heavy: #dfdfdf;
    --ink: #323232;
    --ink-muted: #8b8a8a;
    --ink-faint: #c3c1bd;
    --accent: #fa5a00;
    --accent-soft: #fff5f0;
    --accent-ink: #ffffff;
    --gain: #e83c3c;
    --loss: #339c09;
    --shadow: rgba(35, 26, 15, 0.22);
    --caption-ink: #6b675f;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --backdrop-1: #111013;
      --backdrop-2: #1a181c;
      --bezel: #050505;
      --bezel-edge: #232226;
      --surface: #1c1c1e;
      --surface-variant: #0f0f10;
      --border: #333338;
      --border-heavy: #424248;
      --ink: #f1efec;
      --ink-muted: #9c9a9e;
      --ink-faint: #45444a;
      --accent: #ff7a35;
      --accent-soft: rgba(255, 122, 53, 0.16);
      --accent-ink: #1c1c1e;
      --gain: #ff6a6a;
      --loss: #43c62c;
      --shadow: rgba(0, 0, 0, 0.55);
      --caption-ink: #b9b6b0;
    }
  }

  :root[data-theme="dark"] {
    --backdrop-1: #111013;
    --backdrop-2: #1a181c;
    --bezel: #050505;
    --bezel-edge: #232226;
    --surface: #1c1c1e;
    --surface-variant: #0f0f10;
    --border: #333338;
    --border-heavy: #424248;
    --ink: #f1efec;
    --ink-muted: #9c9a9e;
    --ink-faint: #45444a;
    --accent: #ff7a35;
    --accent-soft: rgba(255, 122, 53, 0.16);
    --accent-ink: #1c1c1e;
    --gain: #ff6a6a;
    --loss: #43c62c;
    --shadow: rgba(0, 0, 0, 0.55);
    --caption-ink: #b9b6b0;
  }

  :root[data-theme="light"] {
    --backdrop-1: #efece6;
    --backdrop-2: #e5ded3;
    --bezel: #1b1a18;
    --bezel-edge: #35322d;
    --surface: #ffffff;
    --surface-variant: #f5f5f5;
    --border: #eaeaea;
    --border-heavy: #dfdfdf;
    --ink: #323232;
    --ink-muted: #8b8a8a;
    --ink-faint: #c3c1bd;
    --accent: #fa5a00;
    --accent-soft: #fff5f0;
    --accent-ink: #ffffff;
    --gain: #e83c3c;
    --loss: #339c09;
    --shadow: rgba(35, 26, 15, 0.22);
    --caption-ink: #6b675f;
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  html, body { margin: 0; min-height: 100%; }

  body {
    font-family: "LINE Seed TW", "LINE Seed TW_TTF", -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Helvetica Neue", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 18% 12%, var(--backdrop-2), transparent 55%),
      radial-gradient(circle at 84% 88%, var(--backdrop-2), transparent 50%),
      var(--backdrop-1);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 22px;
    padding: 48px 20px 64px;
  }

  .studio-tag {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
  }

  .studio-tag .eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .studio-tag h1 { margin: 0; font-size: 19px; font-weight: 700; color: var(--ink); }

  .studio-tag p {
    margin: 0;
    font-size: 12.5px;
    color: var(--caption-ink);
    max-width: 320px;
    line-height: 1.5;
  }

  .device {
    background: linear-gradient(160deg, var(--bezel-edge), var(--bezel) 60%);
    border-radius: 52px;
    padding: 14px;
    box-shadow: 0 30px 60px -20px var(--shadow), 0 2px 10px rgba(0,0,0,0.15);
    position: relative;
  }

  .screen {
    width: 402px;
    height: 852px;
    background: var(--surface-variant);
    border-radius: 40px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .dynamic-island {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 108px;
    height: 28px;
    background: var(--bezel);
    border-radius: 16px;
    z-index: 20;
  }

  .chrome {
    flex-shrink: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }

  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 26px 8px;
  }

  .status-bar .time {
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .status-icons { display: flex; align-items: center; gap: 6px; color: var(--ink); }

  .header-row {
    display: flex;
    align-items: center;
    height: 48px;
    padding: 0 4px;
    position: relative;
  }

  .icon-btn {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    color: var(--ink);
    cursor: pointer;
    border-radius: 12px;
  }

  .icon-btn:hover { background: var(--surface-variant); }

  .header-row h2 {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
  }

  .scroll-area { flex: 1; overflow-y: auto; overflow-x: hidden; }

  .brief-card {
    background: var(--surface);
    padding: 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    position: relative;
  }

  .update-time {
    position: absolute;
    top: 10px;
    right: 24px;
    display: flex;
    align-items: center;
    gap: 4px;
    color: var(--ink-muted);
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }

  .refresh-btn {
    background: none;
    border: none;
    color: var(--ink-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2px;
    width: 20px;
    height: 20px;
  }

  .refresh-btn:hover { color: var(--accent); }

  .refresh-btn.is-spinning svg { animation: spin 0.6s linear; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .stock-title { font-size: 16px; font-weight: 700; color: var(--ink); }

  .stat-row { display: flex; gap: 10px; }

  .stat-item { flex: 1; display: flex; flex-direction: column; gap: 0; min-width: 0; }
  .stat-item .label { font-size: 14px; color: var(--ink); line-height: 1.5; }
  .stat-item .value { font-size: 16px; font-weight: 700; line-height: 1.5; font-variant-numeric: tabular-nums; }

  .page-body { padding: 20px; display: flex; flex-direction: column; gap: 24px; }

  .detail-card {
    background: var(--surface);
    border-radius: 8px;
    padding: 0 12px;
    display: flex;
    flex-direction: column;
  }

  .detail-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    font-size: 16px;
  }

  .detail-row:last-child { border-bottom: none; }
  .detail-row .value { font-variant-numeric: tabular-nums; }

  .section-label {
    font-size: 16px;
    font-weight: 700;
    color: var(--ink-muted);
    padding: 0 8px;
    height: 24px;
    display: flex;
    align-items: center;
  }

  .holdings-section { min-width: 0; }

  .holdings-wrap {
    background: var(--surface);
    display: flex;
    align-items: stretch;
    margin: 0 -20px;
    min-width: 0;
    overflow: hidden;
  }

  .holdings-scroll {
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .holdings-scroll::-webkit-scrollbar { height: 6px; }
  .holdings-scroll::-webkit-scrollbar-thumb { background: var(--border-heavy); border-radius: 3px; }

  .holdings-fixed {
    flex-shrink: 0;
    width: 40px;
    box-shadow: -6px 0 8px -4px var(--shadow);
    position: relative;
    z-index: 3;
  }

  table.holdings { border-collapse: collapse; width: max-content; }

  .holdings thead th {
    position: sticky;
    top: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border-heavy);
    z-index: 2;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    height: 36px;
    padding: 0 4px;
    white-space: nowrap;
    text-align: right;
    box-sizing: border-box;
  }

  .holdings thead th.first { text-align: left; padding-left: 12px; padding-right: 6px; }

  .holdings th button.sort {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    flex-direction: row-reverse;
    background: none;
    border: none;
    font: inherit;
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
    padding: 0;
  }

  .holdings th.first button.sort { flex-direction: row; }

  .sort-icon {
    display: inline-flex;
    flex-direction: column;
    width: 10px;
    height: 12px;
    flex-shrink: 0;
  }

  .sort-icon span {
    width: 0;
    height: 0;
    border-left: 3.5px solid transparent;
    border-right: 3.5px solid transparent;
  }

  .sort-icon .up { border-bottom: 4px solid var(--ink-faint); margin-bottom: 1.5px; }
  .sort-icon .down { border-top: 4px solid var(--ink-faint); }
  .sort-icon.asc .up { border-bottom-color: var(--accent); }
  .sort-icon.desc .down { border-top-color: var(--accent); }

  .holdings tbody td {
    height: 50px;
    padding: 0 4px;
    font-size: 16px;
    color: var(--ink);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    text-align: right;
    font-variant-numeric: tabular-nums;
    box-sizing: border-box;
  }

  .holdings tbody td.date-cell {
    text-align: left;
    padding-left: 12px;
    font-variant-numeric: normal;
  }

  .date-cell .d { font-size: 14px; color: var(--ink); }
  .date-cell .y { font-size: 12px; color: var(--ink-muted); display: block; line-height: 1.3; }

  .pnl-gain { color: var(--gain); }
  .pnl-loss { color: var(--loss); }
  .pnl-flat { color: var(--ink-muted); }

  table.holdings-fixed-table { border-collapse: collapse; width: 100%; }

  .holdings-fixed-table th {
    position: sticky;

<script>
(function () {
  "use strict";

  var RAW = [
    ["2026-04-27", 39, 35.30, 631, 45.82, 35.68, 2012, 0, 0, "1694A"],
    ["2026-04-25", 39, 35.30, 631, 45.82, 35.68, 2012, 0, 0, "1694B"],
    ["2026-04-23", 39, 35.30, -220, -12.35, 35.68, 1990, 0, 0, "1683C"],
    ["2026-04-10", 39, 35.30, 631, 45.82, 35.68, 2012, 0, 0, "1662A"],
    ["2026-03-28", 42, 34.10, 480, 33.20, 34.55, 1912, 0, 0, "1601D"],
    ["2026-03-14", 42, 34.10, -95, -6.40, 34.55, 1832, 0, 0, "1544A"],
    ["2026-02-26", 40, 32.80, 356, 27.10, 33.20, 1720, 0, 0, "1498B"],
    ["2026-02-11", 40, 32.80, 356, 27.10, 33.20, 1720, 0, 0, "1451A"],
    ["2026-01-22", 38, 31.50, -140, -11.60, 32.00, 1596, 0, 0, "1402C"],
    ["2026-01-08", 38, 31.50, 289, 24.05, 32.00, 1596, 0, 0, "1360A"],
    ["2025-12-19", 36, 30.20, 210, 19.30, 30.70, 1447, 0, 0, "1305B"],
    ["2025-12-02", 36, 30.20, 210, 19.30, 30.70, 1447, 0, 0, "1268A"]
  ].map(function (r) {
    return {
      date: r[0], shares: r[1], price: r[2], unrealized: r[3], profitRate: r[4],
      breakeven: r[5], marketValue: r[6], fee: r[7], tax: r[8], orderNo: r[9]
    };
  });

  var COLUMNS = [
    { key: "date", label: "成交日", first: true },
    { key: "shares", label: "股數" },
    { key: "price", label: "成交價" },
    { key: "unrealized", label: "未實現", pnl: true },
    { key: "profitRate", label: "獲利率", pnl: true },
    { key: "breakeven", label: "損益平衡價" },
    { key: "marketValue", label: "市值" },
    { key: "fee", label: "手續費" },
    { key: "tax", label: "交易稅" },
    { key: "orderNo", label: "委托書號" }
  ];

  var state = { sortKey: "date", sortDir: "desc" };

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function fmtInt(n) { return Math.round(n).toLocaleString("en-US"); }
  function fmtPnl(n) { return Math.round(Math.abs(n)).toLocaleString("en-US"); }
  function fmtPct(n) { return Math.abs(n).toFixed(2) + "%"; }
  function pnlClass(n) { return n > 0 ? "pnl-gain" : (n < 0 ? "pnl-loss" : "pnl-flat"); }

  function sortRows() {
    var key = state.sortKey, dir = state.sortDir;
    return RAW.slice().sort(function (a, b) {
      var av = a[key], bv = b[key];
      if (av < bv) return dir === "asc" ? -1 : 1;
      if (av > bv) return dir === "asc" ? 1 : -1;
      return 0;
    });
  }

  function renderHead() {
    var row = document.getElementById("holdingsHead");
    row.innerHTML = "";
    COLUMNS.forEach(function (col) {
      var th = document.createElement("th");
      if (col.first) th.className = "first";

      var btn = document.createElement("button");
      btn.className = "sort";
      btn.type = "button";

      var span = document.createElement("span");
      span.textContent = col.label;

      var icon = document.createElement("span");
      var active = state.sortKey === col.key;
      icon.className = "sort-icon" + (active ? (" " + state.sortDir) : "");
      icon.innerHTML = '<span class="up"></span><span class="down"></span>';

      btn.appendChild(span);
      btn.appendChild(icon);

      btn.addEventListener("click", function () {
        if (state.sortKey === col.key) {
          state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
        } else {
          state.sortKey = col.key;
          state.sortDir = "desc";
        }
        renderAll();
      });

      th.appendChild(btn);
      row.appendChild(th);
    });
  }

  function renderBody(rows) {
    var body = document.getElementById("holdingsBody");
    var fixedBody = document.getElementById("holdingsFixedBody");
    body.innerHTML = "";
    fixedBody.innerHTML = "";

    rows.forEach(function (r) {
      var d = new Date(r.date + "T00:00:00");
      var tr = document.createElement("tr");

      var tdDate = document.createElement("td");
      tdDate.className = "date-cell";
      tdDate.innerHTML = '<span class="d">' + pad(d.getMonth() + 1) + "/" + pad(d.getDate()) + '</span><span class="y">' + d.getFullYear() + "</span>";
      tr.appendChild(tdDate);

      var tdShares = document.createElement("td");
      tdShares.textContent = fmtInt(r.shares);
      tr.appendChild(tdShares);

      var tdPrice = document.createElement("td");
      tdPrice.textContent = r.price.toFixed(2);
      tr.appendChild(tdPrice);

      var tdUnrealized = document.createElement("td");
      tdUnrealized.className = pnlClass(r.unrealized);
      tdUnrealized.textContent = fmtPnl(r.unrealized);
      tr.appendChild(tdUnrealized);

      var tdRate = document.createElement("td");
      tdRate.className = pnlClass(r.profitRate);
      tdRate.textContent = fmtPct(r.profitRate);
      tr.appendChild(tdRate);

      var tdBreakeven = document.createElement("td");
      tdBreakeven.textContent = r.breakeven.toFixed(2);
      tr.appendChild(tdBreakeven);

      var tdMarket = document.createElement("td");
      tdMarket.textContent = fmtInt(r.marketValue);
      tr.appendChild(tdMarket);

      var tdFee = document.createElement("td");
      tdFee.textContent = fmtInt(r.fee);
      tr.appendChild(tdFee);

      var tdTax = document.createElement("td");
      tdTax.textContent = fmtInt(r.tax);
      tr.appendChild(tdTax);

      var tdOrder = document.createElement("td");
      tdOrder.textContent = r.orderNo;
      tr.appendChild(tdOrder);

      body.appendChild(tr);

      var fixedTr = document.createElement("tr");
      var fixedTd = document.createElement("td");
      var modifyBtn = document.createElement("button");
      modifyBtn.className = "modify-btn";
      modifyBtn.type = "button";
      modifyBtn.textContent = "修改";
      modifyBtn.addEventListener("click", function () {
        modifyBtn.textContent = "已送出";
        setTimeout(function () { modifyBtn.textContent = "修改"; }, 900);
      });
      fixedTd.appendChild(modifyBtn);
      fixedTr.appendChild(fixedTd);
      fixedBody.appendChild(fixedTr);
    });
  }

  function renderAll() {
    renderHead();
    renderBody(sortRows());
  }

  document.getElementById("backBtn").addEventListener("click", function () {
    var btn = this;
    btn.style.transform = "scale(0.9)";
    setTimeout(function () { btn.style.transform = ""; }, 120);
  });

  document.getElementById("refreshBtn").addEventListener("click", function () {
    var btn = this;
    btn.classList.add("is-spinning");
    setTimeout(function () { btn.classList.remove("is-spinning"); }, 600);
    var now = new Date();
    document.getElementById("updateTime").textContent =
      pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
  });

  renderAll();
})();
</script>
